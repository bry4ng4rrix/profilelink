worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","host":"$host","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Trust CF-Connecting-IP only from Cloudflare, so rate limits apply to real visitors.
    include /etc/nginx/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    # Generous on purpose: mobile operators put many subscribers behind one address.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=300r/m;
    limit_req_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    # Authenticated Origin Pulls: only Cloudflare holds a client certificate for this CA.
    # A UFW rule would not do this: ports published by Docker bypass UFW.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
    ssl_verify_client on;

    # Docker's DNS, read at request time so a redeployed container is found again.
    resolver 127.0.0.11 valid=10s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Refuses any host name that is not served below.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.profil.mg;
        return 301 https://profil.mg$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name profil.mg;

        set $frontend http://frontend:3000;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /api/revalidate is reserved for the backend, over the Docker network.
        location /api/ {
            return 404;
        }

        location / {
            limit_req zone=public burst=100 nodelay;
            proxy_pass $frontend;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.profil.mg;
        client_max_body_size 6m;

        set $backend http://backend:8000;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;

        # /media stays allowed: crawlers must be able to read og:image.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /r/\nDisallow: /api/\n";
        }

        location /media/ {
            alias /srv/media/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Answers 404 unless REGISTRATION_TOKEN is set. Same strict limit as the login.
        location = /register {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $backend;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $backend;
        }

        location /api/v1/admin/ {
            limit_req zone=admin burst=40 nodelay;
            proxy_pass $backend;
        }

        location /api/v1/public/ {
            limit_req zone=public burst=100 nodelay;
            proxy_pass $backend;
        }

        location /r/ {
            limit_req zone=public burst=100 nodelay;
            proxy_pass $backend;
        }

        location / {
            return 404;
        }
    }
}
