# Local development and tests only. Bound to localhost; the password is not a secret.
name: profilelink-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: profilelink
      POSTGRES_PASSWORD: profilelink
      POSTGRES_DB: profilelink
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/tests/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profilelink"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
