# Local development and tests only. Bound to localhost; the database password is not a secret.
name: profilelink-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: profilelink
      POSTGRES_PASSWORD: profilelink
      POSTGRES_DB: profilelink
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/tests/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profilelink"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # Shares the host network: `next dev` runs on the host, and UFW refuses calls coming from
    # a Docker bridge, so the API could not purge the page cache otherwise.
    network_mode: host
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 127.0.0.1 --port 8000"]
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  media:
