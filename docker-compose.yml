name: profilelink

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IP_HASH_KEY: ${IP_HASH_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - edge # validating a destination needs public DNS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_ORIGIN}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
      - edge

networks:
  internal:
    internal: true # no route to the Internet: PostgreSQL cannot be reached from outside
  edge:

volumes:
  pgdata:
  media:
